<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work — Katie Duthie</title>
<meta name="description" content="Selected projects by Katie Duthie: apps, hardware and interactive experiments.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4f0e9; --ink:#23221f; --soft:#7c776d; --line:rgba(35,34,31,.16); --acc:#8b78a8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { min-height:100%; background:var(--bg); color:var(--ink); font-family:"Inter",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  .wrap { max-width:1200px; margin:0 auto; padding:clamp(24px,5vw,72px); }

  .top { display:flex; justify-content:space-between; font-size:13px; letter-spacing:.02em; }
  .top nav { display:flex; gap:1.8rem; }
  .top a { color:var(--soft); transition:color .3s; }
  .top a:hover, .top a[aria-current] { color:var(--ink); }
  .top .mark { color:var(--ink); font-family:"Fraunces",serif; font-size:16px; font-weight:300; }

  header.intro { margin:clamp(56px,10vw,120px) 0 clamp(36px,6vw,72px); display:grid; grid-template-columns:1fr minmax(0,34ch); gap:2rem; align-items:end; }
  h1 { font-family:"Fraunces",Georgia,serif; font-weight:300; font-size:clamp(3rem,9vw,8rem); line-height:.95; letter-spacing:-.03em; }
  h1 em { font-style:italic; color:var(--acc); }
  .intro p { color:var(--soft); line-height:1.6; font-size:15px; }

  h2 { font-size:12px; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--soft); display:flex; align-items:center; gap:.9rem; margin:clamp(40px,7vw,80px) 0 .6rem; }
  h2::after { content:""; flex:1; height:1px; background:var(--line); }

  ol.list { list-style:none; counter-reset:w; }
  ol.list li { counter-increment:w; border-bottom:1px solid var(--line); opacity:0; transform:translateY(12px); animation:in .9s cubic-bezier(.2,.7,.2,1) forwards; }
  ol.list a { display:grid; grid-template-columns:3rem minmax(0,1.2fr) minmax(0,1.4fr) 8.5rem; gap:1.2rem; align-items:baseline; padding:clamp(18px,2.6vw,30px) 0; transition:padding .5s cubic-bezier(.2,.8,.2,1), color .3s; }
  ol.list a::before { content:counter(w,decimal-leading-zero); font-size:12px; color:var(--soft); letter-spacing:.1em; }
  .name { font-family:"Fraunces",Georgia,serif; font-weight:300; font-size:clamp(1.6rem,3.6vw,3rem); letter-spacing:-.02em; line-height:1.05; transition:transform .5s cubic-bezier(.2,.8,.2,1), color .3s; }
  .desc { color:var(--soft); font-size:14px; line-height:1.5; }
  .tag { text-align:right; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--soft); white-space:nowrap; }
  .tag i { font-style:normal; display:inline-block; margin-left:.7rem; transition:transform .4s; }
  ol.list a:hover .name, ol.list a:focus-visible .name { transform:translateX(12px); color:var(--acc); }
  ol.list a:hover .tag i, ol.list a:focus-visible .tag i { transform:translate(4px,-4px); }
  ol.list a:focus-visible { outline:1px solid var(--acc); outline-offset:4px; }
  .thumb { display:none; }

  .more ol.list .name { font-size:clamp(1.3rem,2.6vw,2rem); }
  .more ol.list a { padding:clamp(14px,2vw,22px) 0; }

  /* floating preview that follows the cursor (fine pointers only) */
  .peek { position:fixed; left:0; top:0; width:min(340px,26vw); aspect-ratio:4/3; z-index:5; pointer-events:none; overflow:hidden; border-radius:14px; background:#e8e2d6;
    box-shadow:0 24px 60px -20px rgba(35,34,31,.35); clip-path:inset(50% 50% 50% 50% round 14px); transition:clip-path .55s cubic-bezier(.2,.8,.2,1); will-change:transform; }
  .peek.on { clip-path:inset(0 0 0 0 round 14px); }
  .peek img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transform:scale(1.08); transition:opacity .4s, transform .8s cubic-bezier(.2,.8,.2,1); }
  .peek img.on { opacity:1; transform:none; }

  footer { margin-top:clamp(60px,9vw,120px); display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; font-size:13px; color:var(--soft); }
  footer a { border-bottom:1px solid var(--line); padding-bottom:2px; transition:color .3s,border-color .3s; }
  footer a:hover { color:var(--ink); border-color:var(--ink); }

  @keyframes in { to { opacity:1; transform:none; } }
  @media (hover:none), (pointer:coarse) { .peek { display:none; } .thumb { display:block; } }
  @media (max-width:760px) {
    header.intro { grid-template-columns:1fr; }
    ol.list a { grid-template-columns:2.2rem 1fr auto; row-gap:.4rem; }
    .desc { grid-column:2 / 4; order:3; }
    .thumb { grid-column:2 / 4; order:4; width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:10px; margin-top:.6rem; background:#e8e2d6; }
  }
  @media (prefers-reduced-motion:reduce) { ol.list li { animation-duration:.01s; } .peek,.peek img,.name { transition:none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="mark" href="./">Katie Duthie</a>
    <nav>
      <a href="proj.html" aria-current="page">Work</a>
      <a href="https://www.linkedin.com/in/katieknauss19/" target="_blank" rel="noopener">LinkedIn</a>
    </nav>
  </div>

  <header class="intro">
    <h1>Selected <em>work</em></h1>
    <p>Apps, hardware and interactive experiments. Each one started with a small, stubborn problem worth solving properly.</p>
  </header>

  <h2>Featured</h2>
  <ol class="list" id="featured"></ol>

  <div class="more">
    <h2>Experiments &amp; coursework</h2>
    <ol class="list" id="more"></ol>
  </div>

  <footer>
    <span>© Katie Duthie</span>
    <span><a href="./">Home</a> &nbsp;·&nbsp; <a href="proj-classic.html">Previous version of this page</a></span>
  </footer>
</div>

<div class="peek" id="peek" aria-hidden="true"></div>

<script>
(() => {
  const FEATURED = [
    { n:"BizLink",          href:"projects/bizlink.html",       img:"pictures/BizlinkWide.jpg",           d:"A digital business card that makes professional networking effortless.", t:"Mobile app" },
    { n:"Decidr",           href:"projects/decidr.html",        img:"pictures/decidr-wide.jpg",           d:"Helps groups settle on a decision — dinner, a movie, a game — without the debate.", t:"Web app" },
    { n:"Course Companion", href:"projects/courseCompanion.html", img:"pictures/ccLogo.png", c:1,              d:"A friendlier take on university course registration, built with a student team.", t:"Web app" },
    { n:"Whirl-i-Cook SmartStand", href:"projects/smartStand.html", img:"pictures/smartStandLogoWide.jpg", d:"A kitchen device for the multitasking cook, from motivation to working hardware.", t:"Hardware" },
  ];
  const MORE = [
    { n:"Elemental Endeavor", href:"projects/elemental-endeavor.html", img:"pictures/ElementalEndeavor.png", c:1, d:"Tic-tac-toe, reimagined with fire, water and earth.", t:"Game" },
    { n:"Hide’n’Heat",        href:"projects/hide_n_heat.html",        img:"pictures/sizzleTheFlameWide4.jpg", d:"A hide-and-seek variation made for young children.", t:"Game" },
    { n:"Planet Unlock",      href:"projects/planets.html",            img:"pictures/space.jpg",             d:"Unlock your phone by choosing planets in a secret order.", t:"Interaction" },
    { n:"Hungry Little Man",  href:"projects/little-hungry-man.html",  img:"pictures/appleBananaGrapes.png", c:1, d:"A gyroscope unlock where you feed a character in the right order.", t:"Interaction" },
    { n:"Five Point Indirection Server", href:"projects/indirectionServer.html", img:"pictures/sketches/SeekerScreen.png", d:"A multiplayer game concept, from sketches to a running server.", t:"Game" },
  ];
  const peek = document.getElementById("peek"), imgs = new Map();
  let delay = 0;
  const build = (id, items) => {
    const ol = document.getElementById(id);
    items.forEach(p => {
      const li = document.createElement("li"); li.style.animationDelay = (delay += .07) + "s";
      const a = document.createElement("a"); a.href = p.href;
      a.innerHTML = `<span class="name"></span><span class="desc"></span><span class="tag">${p.t}<i aria-hidden="true">↗</i></span>`;
      a.querySelector(".name").textContent = p.n; a.querySelector(".desc").textContent = p.d;
      const th = new Image(); th.className = "thumb"; th.alt = ""; th.loading = "lazy"; th.src = p.img; if (p.c) { th.style.objectFit = "contain"; th.style.background = "#fff"; } a.appendChild(th);
      const pi = new Image(); pi.src = p.img; pi.alt = ""; if (p.c) { pi.style.objectFit = "contain"; pi.style.background = "#fff"; pi.style.padding = "10%"; } peek.appendChild(pi); imgs.set(a, pi);
      a.addEventListener("pointerenter", e => { if (e.pointerType !== "mouse") return; imgs.forEach(i => i.classList.remove("on")); pi.classList.add("on"); peek.classList.add("on"); });
      a.addEventListener("pointerleave", () => { peek.classList.remove("on"); pi.classList.remove("on"); });
      li.appendChild(a); ol.appendChild(li);
    });
  };
  build("featured", FEATURED); build("more", MORE);

  // preview follows the cursor with a little inertia
  let tx = 0, ty = 0, x = 0, y = 0;
  addEventListener("pointermove", e => { tx = e.clientX + 28; ty = e.clientY - 90; });
  (function loop() {
    x += (tx - x)*.14; y += (ty - y)*.14;
    const w = peek.offsetWidth, h = peek.offsetHeight;
    const px = Math.min(x, innerWidth - w - 16), py = Math.max(16, Math.min(y, innerHeight - h - 16));
    peek.style.transform = `translate(${px}px,${py}px)`;
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
