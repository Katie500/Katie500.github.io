<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notices — Empyrean Notebook</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="empyrean.css">
</head><body><div class="wrap"><main id="app"></main></div>
<script src="seed.js"></script><script src="app.js"></script>
<script>
const { h, svg, data } = E;
E.layout("notices.html", "Notices <em>&amp; snippets</em>", "The public notices and the in-world snippets that open each chapter, on one timeline. Tick “snippet” when you log a chapter opening and pick which book it comes from.");
const app = document.getElementById("app");
const SOURCES = [["dragonkind","DragonKind library"],["bonus","Bonus content"],["other","Other"]];
const SNIPPET_BOOKS = ["FW","IF","OS"];
let type = "all", q = "", bookFilter = "all", newestFirst = false, srcFilter = "all", sortMode = "chapter";
const isSnip = x => !!x.snippet;

const editForm = (n = {}) => E.form({
  title: n.id ? "Edit entry" : "Log a notice or snippet",
  value:n.id ? n : { snippet:type === "snippet", source:type === "bonus" ? "bonus" : "dragonkind", book:type === "snippet" ? (bookFilter !== "all" ? bookFilter : "FW") : "OT", read:false, theoryIds:[] },
  fields: [
    { k:"snippet", label:"This is a snippet from a book (the opening of a chapter), not a public notice", type:"checkbox" },
    { k:"book", label:"Book", type:"select", options:E.BOOKS.map(b => ({ v:b.id, l:b.name })), hint:"For a snippet, pick the book it opens a chapter in.", autoSet:{ when:"snippet", ifIn:SNIPPET_BOOKS, to:"FW" } },
    { k:"chapter", label:"Chapter", type:"text", showIf:"snippet", placeholder:"e.g. 12" },
    { k:"from", label:"Source it quotes", type:"text", showIf:"snippet", placeholder:"e.g. Article 5, Section 7, the Dragon Rider’s Codex", hint:"Optional. If blank, it is read from the last line of the snippet (the part after the dash)." },
    { k:"title", label:"Title", type:"text", hint:"Optional for snippets; it defaults to the book and chapter." },
    { k:"source", label:"Where it’s from", type:"select", hideIf:"snippet", options:SOURCES.map(([v, l]) => ({ v, l })) },
    { k:"url", label:"Link", type:"url", hideIf:"snippet", placeholder:"https://…" },
    { k:"inWorld", label:"In-world year", type:"text", hideIf:"snippet", placeholder:"e.g. Year 628" },
    { k:"transcriber", label:"Transcribed by", type:"text", hideIf:"snippet" },
    { k:"date", label:"Date posted (real world)", type:"date", hideIf:"snippet" },
    { k:"summary", label:"Summary (your own words)", type:"textarea" },
    { k:"text", label:"Text", type:"textarea" },
    { k:"read", label:"I’ve read this", type:"checkbox" },
    { k:"theoryIds", label:"Theories it relates to", type:"multi", options:E.optionsOf("theories", t => t.title) },
    { k:"cites", label:"Book page references it connects to", type:"cites" },
  ],
  onSave: o => {
    o.id = o.id || E.uid("n");
    if (o.snippet) { o.source = "book"; if (!o.title) o.title = E.bookOf(o.book).name + " — Chapter " + (o.chapter || "?"); }
    else if (!o.title) o.title = "Public Notice";
    E.upsert("notices", o); render();
  },
  onDelete: n.id ? () => { E.remove("notices", n.id); render(); } : null,
});

// Paste many chapter openings at once: "# 12" starts a snippet for chapter 12, its text follows.
function bulkSnippets() {
  E.form({
    title:"Bulk add chapter snippets", value:{ book:bookFilter !== "all" ? bookFilter : "FW" },
    fields:[
      { k:"book", label:"Book", type:"select", options:SNIPPET_BOOKS.map(id => ({ v:id, l:E.bookOf(id).name })) },
      { k:"raw", label:"Snippets", type:"textarea", hint:"Start each snippet with a line like “# 12” (the chapter number), then its text on the lines below. Snippets that already exist for the same book and chapter are updated." },
    ],
    onSave:o => {
      const blocks = []; let cur = null;
      (o.raw || "").split(/\r?\n/).forEach(line => { const m = line.match(/^#\s*(.+?)\s*$/); if (m) { cur = { chapter:m[1], text:[] }; blocks.push(cur); } else if (cur) cur.text.push(line); });
      let made = 0, updated = 0;
      blocks.forEach(b => {
        const text = b.text.join("\n").trim(); if (!text) return;
        const id = "snip-" + o.book + "-" + b.chapter.replace(/\W+/g, "_"), ex = E.byId("notices", id);
        const item = ex || { id, snippet:true, source:"book", book:o.book, chapter:b.chapter, title:E.bookOf(o.book).name + " — Chapter " + b.chapter, read:false, theoryIds:[], cites:[] };
        item.text = text; E.upsert("notices", item); ex ? updated++ : made++;
      });
      alert(made + " snippet(s) added, " + updated + " updated." + (blocks.length ? "" : " I didn’t find any lines starting with “# ” followed by a chapter number."));
      render();
    },
  });
}

// Reads a saved copy of the DragonKind library page and stores each notice's text in this browser only.
function importText() {
  E.form({
    title:"Import notices from DragonKind", value:{},
    fields:[{ k:"html", label:"Page source", type:"textarea", hint:"On dragonkind.com/library press Ctrl/Cmd+U (view source), select all, copy, and paste it here. It is read in your browser. New notices are added automatically; existing ones get their text filled in." }],
    onSave:o => {
      const doc = new DOMParser().parseFromString(o.html || "", "text/html"), arts = [...doc.querySelectorAll("article.notice-sheet")];
      if (!arts.length) { alert("I couldn’t find any notices in that. Make sure you copied the whole page source."); return; }
      const seqs = data.notices.map(x => x.seq).filter(x => x != null), base = Math.min(0, ...seqs) - arts.length;
      let filled = 0, created = 0;
      arts.forEach((a, i) => {
        const num = (a.id || "").replace(/^notice-/, "").replace("-", "."), id = "s-n-" + (a.id || "").replace(/^notice-/, "");
        const text = [...a.querySelectorAll(".notice-body p")].map(p => p.textContent.trim()).join("\n\n");
        const who = (a.querySelector(".notice-transcriber")?.textContent || "").replace(/^Transcribed by\s*/i, "").trim();
        if (!num || !text) return;
        const ex = E.byId("notices", id);
        if (ex) { ex.text = text; if (!ex.transcriber) ex.transcriber = who; E.upsert("notices", ex); filled++; }
        else { E.upsert("notices", { id, title:"Public Notice " + num, source:"dragonkind", url:"https://dragonkind.com/library", inWorld:"Year " + num.split(".")[0], transcriber:who, seq:base + i, book:"OT", read:false, theoryIds:[], summary:"", text, cites:[] }); created++; }
      });
      alert("Done: original text added to " + filled + " notice(s), " + created + " new notice(s) created.");
      render();
    },
  });
}

const numOf = x => { const m = (x.title || "").match(/(\d+)\.(\d+)/) || (x.id || "").match(/(\d+)-(\d+)$/); return m ? [+m[1], +m[2]] : [null, null]; };
const chapterOf = x => { const v = parseFloat(x.chapter); return isNaN(v) ? 1e9 : v; };
const bookIdx = x => E.BOOKS.findIndex(b => b.id === x.book);
const NOTICE_COLOR = "#a8502d", SNIPPET_COLOR = "#8b78a8";

// Which in-world work a snippet quotes (the Codex, the Book of Brennan, Colonel Kaori's field guide...) and where in it.
const NUMWORDS = { one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9, ten:10 };
const numFrom = w => NUMWORDS[String(w).toLowerCase()] ?? parseInt(w, 10);
const lastLine = x => { const m = (x.text || "").trim().split("\n").pop().match(/^[—–-]\s*(.+)$/); return m ? m[1].trim() : ""; };
const srcRaw = x => (x.from || "").trim() || lastLine(x);
const WORKS = [
  [/Dragon (Rider|Writer)['’]?s Codex/i, "The Dragon Rider’s Codex"], [/Code of Conduct/i, "Basgiath War College Code of Conduct"], [/Book of Brennan/i, "The Book of Brennan"],
  [/Af?fendra|Offendra/i, "Major Affendra’s Guide to the Riders Quadrant"], [/Kaori/i, "Colonel Kaori’s Field Guide to Dragonkind"], [/Markham/i, "Navarre: An Unedited History"],
  [/Daxton/i, "Colonel Daxton’s Guide to the Scribe Quadrant"], [/Frederick/i, "Major Frederick’s Modern Guide for Healers"], [/Recovered correspondence/i, "Xaden’s correspondence to Violet"],
  [/Warrick/i, "The Journal of Warrick of Luceras"], [/Journey of the First Six/i, "The Journey of the First Six"], [/Tyrrish Rebellion/i, "The Tyrrish Rebellion"],
  [/Treaty of/i, "The Treaty of Aretia"], [/Royal Proclamation/i, "Royal Proclamation"], [/Panchek/i, "Panchek"],
];
const workOf = x => {
  const s = srcRaw(x).replace(/\s*\[\?[^\]]*\]/g, "").trim(); if (!s) return "No source recorded";
  for (const [re, name] of WORKS) if (re.test(s)) return name;
  return s.replace(/^Page\s+\d+,?\s*/i, "").replace(/^Article\s+\w+,?\s*Section\s+\w+,?\s*/i, "").replace(/^Addendum\s+[\d.]+,?\s*/i, "").replace(/,?\s*(Unauthorized|Unedited|Second|Third)\s+Edition.*$/i, "").trim() || s;
};
const sectionOf = x => {
  const s = srcRaw(x);
  let m = s.match(/Article\s+(\w+)\s*,?\s*Section\s+(\w+)/i);
  if (m) { const a = numFrom(m[1]), b = numFrom(m[2]); return { key:a * 100 + b, label:"Article " + a + ", Section " + b }; }
  m = s.match(/Addendum\s+(\d+)\.(\d+)/i);
  if (m) return { key:10000 + (+m[1]) * 100 + (+m[2]), label:"Addendum " + m[1] + "." + m[2] };
  m = s.match(/Page\s+(\d+)/i);
  if (m) return { key:+m[1], label:"Page " + m[1] };
  return { key:1e9, label:"" };
};

// Notices by in-world number, then snippets by book and chapter (or by source and section within it).
function ordered(list) {
  const notices = list.filter(x => !isSnip(x)).map(x => ({ x, num:numOf(x) })).sort((a, b) => ((a.num[0] ?? 1e9) - (b.num[0] ?? 1e9)) || ((a.num[1] ?? 0) - (b.num[1] ?? 0)));
  const bySource = sortMode === "section";
  const snippets = list.filter(isSnip).map(x => ({ x, num:[null, null], work:workOf(x), sec:sectionOf(x) })).sort((a, b) =>
    (bySource ? a.work.localeCompare(b.work) || (a.sec.key - b.sec.key) : 0) || (bookIdx(a.x) - bookIdx(b.x)) || (chapterOf(a.x) - chapterOf(b.x)));
  const all = [...notices, ...snippets];
  all.forEach(it => { it.group = isSnip(it.x) ? (bySource ? it.work : E.bookOf(it.x.book).name) : (it.num[0] != null ? "Year " + it.num[0] : "Undated"); it.short = isSnip(it.x) ? it.x.book + " " + (it.x.chapter || "?") : (it.num[0] != null ? it.num[0] + "." + it.num[1] : "—"); });
  return newestFirst ? all.reverse() : all;
}

function axis(items) {
  const STEP = 64, JUMP = 54, PAD = 46, top = 44, base = 96;
  const pos = []; let x = PAD, prev = null;
  items.forEach(it => { if (prev && prev.group !== it.group) x += JUMP; pos.push(x); x += STEP; prev = it; });
  const W = x + PAD - STEP + 30, el = svg("svg", { width:Math.max(W, 300), height:150, role:"img", "aria-label":"Timeline of notices and snippets" });
  el.append(svg("line", { x1:PAD - 24, x2:W - PAD + 20, y1:base, y2:base, stroke:"rgba(35,34,31,.25)" }));
  // group brackets and labels
  let i = 0;
  while (i < items.length) {
    let j = i; while (j + 1 < items.length && items[j + 1].group === items[i].group) j++;
    const snip = isSnip(items[i].x), col = snip ? SNIPPET_COLOR : NOTICE_COLOR;
    el.append(svg("path", { d:`M${pos[i] - 10},${top + 14} V${top + 20} H${pos[j] + 10} V${top + 14}`, fill:"none", stroke:col, "stroke-opacity":.5 }));
    const lab = svg("text", { x:(pos[i] + pos[j]) / 2, y:top + 8, "font-size":11, "text-anchor":"middle", fill:col, "font-weight":500 }); lab.textContent = items[i].group; el.append(lab);
    if (j + 1 < items.length && !isSnip(items[i].x) && !isSnip(items[j + 1].x)) {
      const a = items[j].num[0], b = items[j + 1].num[0];
      if (a != null && b != null && Math.abs(b - a) > 1) { const g = svg("text", { x:(pos[j] + pos[j + 1]) / 2, y:base - 12, "font-size":10, "text-anchor":"middle", fill:"#7c776d" }); g.textContent = "· " + Math.abs(b - a) + " yrs ·"; el.append(g); }
    }
    i = j + 1;
  }
  items.forEach((it, k) => {
    const col = isSnip(it.x) ? SNIPPET_COLOR : NOTICE_COLOR, g = svg("g", { style:"cursor:pointer", tabindex:0, role:"link", "aria-label":it.x.title });
    g.append(svg("circle", { cx:pos[k], cy:base, r:8, fill:it.x.read ? col : "#fbf9f5", stroke:col, "stroke-width":2 }));
    const t = svg("text", { x:pos[k], y:base + 26, "font-size":11, "text-anchor":"middle", fill:"#4b473f" }); t.textContent = it.short; g.append(t);
    g.append(svg("title", {}, it.x.title + (it.x.read ? " (read)" : " (unread)")));
    const go = () => { const t2 = document.getElementById(it.x.id); if (t2) { t2.scrollIntoView({ behavior:"smooth", block:"center" }); t2.classList.remove("flash"); void t2.offsetWidth; t2.classList.add("flash"); } };
    g.addEventListener("click", go); g.addEventListener("keydown", ev => { if (ev.key === "Enter") go(); });
    el.append(g);
  });
  return h("div", {},
    h("div", { class:"axis-wrap" }, el),
    h("div", { class:"legend" }, h("span", {}, h("span", { class:"dot", style:"background:" + NOTICE_COLOR }), "Public notice"), h("span", {}, h("span", { class:"dot", style:"background:" + SNIPPET_COLOR }), "Book snippet"), h("span", {}, "Filled = read · outlined = unread · click a point to jump to it")));
}

function entries(items) {
  const out = []; let lastGroup = null, lastYear = null;
  items.forEach(it => {
    const x = it.x, snip = isSnip(x);
    if (it.group !== lastGroup) {
      if (!snip && lastYear != null && it.num[0] != null) { const d = Math.abs(it.num[0] - lastYear); if (d > 1) out.push(h("div", { class:"gap" }, d + " years " + (newestFirst ? "earlier" : "later"))); }
      out.push(h("div", { class:"yr" }, it.group)); lastGroup = it.group;
    }
    if (!snip) lastYear = it.num[0];
    out.push(h("article", { class:"note", id:x.id },
      h("div", { class:"row", style:"justify-content:space-between" },
        h("span", { class:"num", style:snip ? "color:" + SNIPPET_COLOR : "" }, snip ? "SNIPPET · " + E.bookOf(x.book).name.toUpperCase() + " · CHAPTER " + (x.chapter || "?") : (it.num[0] != null ? "PUBLIC NOTICE " + it.num[0] + "." + it.num[1] : (x.title || "").toUpperCase())),        h("span", { class:"pill " + (x.read ? "s-active" : "s-missing") }, x.read ? "read" : "unread")),
      x.text ? h("p", { class:"body", style:"white-space:pre-wrap" }, x.text) : h("p", { class:"body meta" }, x.summary || (snip ? "No text yet. Use Edit to add this chapter’s opening." : "No text yet. Use “Import from DragonKind” or Edit.")),
      x.text && x.summary ? h("div", { class:"meta" }, "In brief: " + x.summary) : null,
      snip && srcRaw(x) ? h("div", { class:"row", style:"margin:.3rem 0" }, h("span", { class:"meta" }, "From:"), h("button", { type:"button", class:"chip", title:"Show only snippets from this source", style:"cursor:pointer", onclick:() => { srcFilter = workOf(x); render(); } }, workOf(x)), sectionOf(x).label ? h("span", { class:"chip" }, sectionOf(x).label) : null) : null,
      !snip && x.transcriber ? h("div", { class:"meta" }, "Transcribed by " + x.transcriber) : null,
      (x.cites || []).map(E.citeView),
      h("div", { class:"row", style:"margin-top:.5rem" },
        (x.theoryIds || []).map(id => E.byId("theories", id)).filter(Boolean).map(t => h("a", { class:"chip", href:"theories.html#" + t.id }, "✦ " + t.title)),
        !snip && x.url ? h("a", { class:"btn sm", href:x.url, target:"_blank", rel:"noopener" }, "Open ↗") : null,
        h("button", { class:"btn sm", onclick:() => { x.read = !x.read; E.upsert("notices", x); render(); } }, x.read ? "Mark unread" : "Mark read"),
        h("button", { class:"btn sm", onclick:() => editForm(x) }, "Edit"))));
  });
  return h("div", { class:"nt" }, out);
}

// every in-world work the saved snippets quote, with how many snippets each has
const snippetWorks = () => {
  const counts = {}; data.notices.filter(isSnip).forEach(n => { const w = workOf(n); counts[w] = (counts[w] || 0) + 1; });
  return Object.entries(counts).sort((a, b) => a[0].localeCompare(b[0]));
};

function render() {
  if (srcFilter !== "all" && !snippetWorks().some(([w]) => w === srcFilter)) srcFilter = "all";
  app.replaceChildren(
    h("div", { class:"grid", style:"margin:1.6rem 0 1.4rem" },
      h("a", { class:"card", href:"https://dragonkind.com/library", target:"_blank", rel:"noopener", style:"text-decoration:none" }, h("h3", {}, "DragonKind library ↗"), h("p", { class:"meta" }, "dragonkind.com/library — open it in a new tab, then log what you find here.")),
      h("a", { class:"card", href:"https://rebeccayarros.com/bonus-content", target:"_blank", rel:"noopener", style:"text-decoration:none" }, h("h3", {}, "Bonus content ↗"), h("p", { class:"meta" }, "rebeccayarros.com/bonus-content — the author’s official extras."))),
    h("div", { class:"toolbar" },
      E.tabs([["all","All"],["notice","Public notices"],["snippet","Book snippets"],["bonus","Bonus content"]], type, k => { type = k; render(); }),
      type === "snippet" || type === "all" ? h("select", { "aria-label":"Book", onchange:e => { bookFilter = e.target.value; renderList(); } }, h("option", { value:"all" }, "All books"), SNIPPET_BOOKS.map(id => h("option", { value:id, selected:bookFilter === id }, E.bookOf(id).name))) : null,
      snippetWorks().length && (type === "snippet" || type === "all") ? h("select", { "aria-label":"Source", onchange:e => { srcFilter = e.target.value; renderList(); } }, h("option", { value:"all" }, "All sources"), snippetWorks().map(([w, n]) => h("option", { value:w, selected:srcFilter === w }, w + " (" + n + ")"))) : null,
      snippetWorks().length && (type === "snippet" || type === "all") ? h("select", { "aria-label":"Snippet order", onchange:e => { sortMode = e.target.value; renderList(); } }, h("option", { value:"chapter", selected:sortMode === "chapter" }, "Snippets by chapter"), h("option", { value:"section", selected:sortMode === "section" }, "Snippets by source, then section")) : null,
      h("span", { class:"grow" }),
      h("button", { class:"btn sm", onclick:() => { newestFirst = !newestFirst; render(); } }, newestFirst ? "Newest first ↓" : "Oldest first ↑"),
      h("input", { type:"search", placeholder:"Search…", value:q, "aria-label":"Search", oninput:e => { q = e.target.value.toLowerCase(); renderList(); } }),
      h("button", { class:"btn", onclick:bulkSnippets }, "Bulk add snippets"),
      h("button", { class:"btn", onclick:importText }, "Import from DragonKind"),
      h("button", { class:"btn primary", onclick:() => editForm() }, "+ Notice or snippet")),
    h("div", { id:"list" }));
  renderList();
}
function renderList() {
  const l = data.notices.filter(n => {
    if (type === "notice" && isSnip(n)) return false;
    if (type === "snippet" && !isSnip(n)) return false;
    if (type === "bonus" && (isSnip(n) || n.source !== "bonus")) return false;
    if (isSnip(n) && bookFilter !== "all" && n.book !== bookFilter) return false;
    if (isSnip(n) && srcFilter !== "all" && workOf(n) !== srcFilter) return false;
    return ((n.title || "") + " " + (n.summary || "") + " " + (n.text || "")).toLowerCase().includes(q);
  });
  const box = document.getElementById("list");
  if (!l.length) { box.replaceChildren(E.emptyState(type === "snippet" ? "No snippets yet. Press “+ Notice or snippet”, tick the snippet box and pick the book." : "Nothing here yet.")); return; }
  const items = ordered(l);
  box.replaceChildren(axis(items), entries(items));
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView({ block:"start" });
}
render();
</script></body></html>
