<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dragons — Empyrean Notebook</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="empyrean.css">
</head><body><div class="wrap"><main id="app"></main></div>
<script src="seed.js"></script><script src="app.js"></script>
<script>
const { h, svg, data } = E;
E.layout("dragons.html", "Dragons &amp; <em>bloodlines</em>", "Record each dragon’s family, sire and dam, rider and fate. The genealogy view draws the tree from the parents you enter, and gryphons have their own tab.");
const app = document.getElementById("app");
const COLORS = { black:"#2b2b2b", red:"#b0372a", orange:"#d9822b", brown:"#7b5434", green:"#4c8a55", blue:"#4a6fa8", tan:"#c4a77d", gold:"#c9a227", gray:"#8a8a8a", grey:"#8a8a8a", white:"#bdb7ad", yellow:"#d4b83c" };
const colorOf = d => COLORS[(d.color || "").toLowerCase().split(/[\s,/]/)[0]] || "#a8a29a";
const TAILS = ["Dagger","Sword","Club","Scorpion","Morningstar","Feather"];
const tailOf = x => { const k = (x.tail || "").toLowerCase().replace(/\s*tail$/, "").trim(); return TAILS.find(t => t.toLowerCase() === k) || x.tail || ""; };
const summary = x => [[x.color, tailOf(x) && tailOf(x) + " tail"].filter(Boolean).join(" "), x.sex, x.family && x.family + " line", x.age != null && x.age !== "" && "est. age " + x.age, x.riders != null && x.riders !== "" && x.riders + " recorded rider" + (x.riders === 1 ? "" : "s")].filter(Boolean).join(" · ");
const COLOR_OPTIONS = ["Black","Blue","Irid","Red","Orange","Brown","Green"];
const STATUS = [["active","Active"],["missing","Missing"],["deceased","Deceased"],["unknown","Not set"]];
let tab = "families", sortKey = "name", sortDir = 1;

const editForm = (d = {}) => E.form({
  title: d.id ? (d.gryphon ? "Edit gryphon" : "Edit dragon") : (d.gryphon ? "Add gryphon" : "Add dragon"), value:{ ...d, tail:tailOf(d) },
  fields: [
    { k:"gryphon", label:"This is a gryphon, not a dragon", type:"checkbox" },
    { k:"name", label:"Name", type:"text" },
    { k:"img", label:"Picture", type:"image" },
    { k:"aliases", label:"Alternate names", type:"text", hint:"Comma-separated, e.g. the dragon’s full name." },
    { k:"color", hideIf:"gryphon", label:"Color", type:"select", options:[{ v:"", l:"— unknown —" }, ...[...COLOR_OPTIONS, ...(d.color && !COLOR_OPTIONS.includes(d.color) ? [d.color] : [])].map(x => ({ v:x, l:x }))] },
    { k:"tail", hideIf:"gryphon", label:"Tail type", type:"select", options:[{ v:"", l:"— unknown —" }, ...[...TAILS, ...(tailOf(d) && !TAILS.includes(tailOf(d)) ? [tailOf(d)] : [])].map(x => ({ v:x, l:x + " tail" }))] },
    { k:"sex", label:"Sex", type:"select", options:[{ v:"", l:"— unknown —" }, { v:"male", l:"Male" }, { v:"female", l:"Female" }] },
    { k:"age", hideIf:"gryphon", label:"Estimated age", type:"number" },
    { k:"riders", hideIf:"gryphon", label:"Recorded riders", type:"number", hint:"How many riders the dragon has had on record." },
    { k:"family", hideIf:"gryphon", label:"Line (bloodline)", type:"text", hint:"e.g. Fhaicorain. Dragons sharing a line are grouped together on the Families tab." },
    { k:"sire", hideIf:"gryphon", label:"Sire (father)", type:"select", options:E.optionsOf("dragons", x => x.name, "— unknown —", x => !x.gryphon).filter(o => o.v !== d.id) },
    { k:"dam", hideIf:"gryphon", label:"Dam (mother)", type:"select", options:E.optionsOf("dragons", x => x.name, "— unknown —", x => !x.gryphon).filter(o => o.v !== d.id) },
    { k:"riderId", label:"Bonded rider", type:"select", options:E.optionsOf("characters", c => c.name, "— none —") },
    { k:"status", label:"Status", type:"select", options:STATUS.map(([v, l]) => ({ v, l })) },
    { k:"notes", label:"Notes", type:"textarea" },
    { k:"cites", label:"Page references", type:"cites" },
  ],
  onSave: o => { o.id = o.id || E.uid("d"); E.upsert("dragons", o); render(); },
  onDelete: d.id ? () => { data.dragons.forEach(x => { if (x.sire === d.id) x.sire = ""; if (x.dam === d.id) x.dam = ""; }); E.remove("dragons", d.id); render(); } : null,
});

const dragonCard = d => {
  const rider = E.byId("characters", d.riderId), s = E.byId("dragons", d.sire), m = E.byId("dragons", d.dam);
  return h("div", { class:"card", id:d.id },
    d.img ? h("img", { src:d.img, alt:d.name, style:"width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;margin-bottom:.7rem" }) : null,
    h("div", { class:"row", style:"justify-content:space-between" },
      h("h3", {}, d.gryphon ? "🪶 " : h("span", { class:"dot", style:"background:" + colorOf(d) }), d.name, E.unverified(d)), h("span", { class:"pill s-" + d.status }, d.status === "unknown" ? "not set" : d.status)),
    d.aliases ? h("div", { class:"meta" }, "also known as " + d.aliases) : null,
    h("div", { class:"meta" }, [d.gryphon ? [d.sex, "gryphon"].filter(Boolean).join(" ") : summary(d), rider && "rider: " + rider.name, s && "sire: " + s.name, m && "dam: " + m.name].filter(Boolean).join(" · ") || "Nothing recorded yet"),
    d.notes ? h("p", { style:"margin:.5rem 0;font-size:14px" }, d.notes) : null,
    (d.cites || []).map(E.citeView),
    h("div", { style:"margin-top:.7rem" }, h("button", { class:"btn sm", onclick:() => editForm(d) }, "Edit")));
};

function families() {
  if (!data.dragons.some(x => !x.gryphon)) return E.emptyState("No dragons yet.");
  const groups = {};
  data.dragons.filter(x => !x.gryphon).forEach(d => (groups[d.family || "No family recorded"] ||= []).push(d));
  return Object.entries(groups).sort(([a], [b]) => a.startsWith("No ") ? 1 : b.startsWith("No ") ? -1 : a.localeCompare(b)).map(([name, list]) =>
    h("section", {}, h("h2", {}, name, h("span", { class:"meta" }, "  " + list.length)), h("div", { class:"grid" }, list.sort((a, b) => a.name.localeCompare(b.name)).map(dragonCard))));
}

function tree() {
  const ds = data.dragons.filter(x => !x.gryphon), map = Object.fromEntries(ds.map(d => [d.id, d]));
  const gen = {}, g = (d, seen = new Set()) => {
    if (gen[d.id] != null) return gen[d.id]; if (seen.has(d.id)) return 0; seen.add(d.id);
    const ps = [map[d.sire], map[d.dam]].filter(Boolean);
    return gen[d.id] = ps.length ? Math.max(...ps.map(p => g(p, seen))) + 1 : 0;
  };
  ds.forEach(d => g(d));
  const linked = new Set(); ds.forEach(d => { if (map[d.sire] || map[d.dam]) { linked.add(d.id); linked.add(d.sire); linked.add(d.dam); } });
  const shown = ds.filter(d => linked.has(d.id));
  if (!shown.length) return E.emptyState("No parent links yet. Edit a dragon and choose its sire and dam; dragons with no recorded parents appear once they are someone’s parent.");
  const cols = {}; shown.forEach(d => (cols[gen[d.id]] ||= []).push(d));
  const W = 170, H = 46, GX = 70, GY = 18, pos = {};
  const maxGen = Math.max(...Object.keys(cols).map(Number));
  for (let k = 0; k <= maxGen; k++) {
    const col = cols[k] || [];
    col.sort((a, b) => {
      const avg = d => { const ys = [d.sire, d.dam].map(p => pos[p]?.y).filter(v => v != null); return ys.length ? ys.reduce((x, y) => x + y) / ys.length : 0; };
      return avg(a) - avg(b) || a.name.localeCompare(b.name);
    });
    col.forEach((d, i) => pos[d.id] = { x:k * (W + GX) + 10, y:i * (H + GY) + 10 });
  }
  const rows = Math.max(...Object.values(cols).map(c => c.length));
  const el = svg("svg", { width:(maxGen + 1) * (W + GX) + 20, height:rows * (H + GY) + 20, role:"img", "aria-label":"Dragon genealogy tree" });
  shown.forEach(d => [["sire","#4a6fa8"], ["dam","#a8502d"]].forEach(([k, col]) => {
    const p = pos[d[k]], c = pos[d.id]; if (!p || !c) return;
    const x1 = p.x + W, y1 = p.y + H / 2, x2 = c.x, y2 = c.y + H / 2, mx = (x1 + x2) / 2;
    el.append(svg("path", { d:`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`, fill:"none", stroke:col, "stroke-width":1.6, opacity:.7 }));
  }));
  shown.forEach(d => {
    const p = pos[d.id], r = E.byId("characters", d.riderId);
    if (d.img) el.append(svg("clipPath", { id:"cp-" + d.id }, svg("circle", { cx:p.x + 22, cy:p.y + H / 2, r:16 })));
    const gEl = svg("g", { style:"cursor:pointer", tabindex:0, role:"button", "aria-label":"Edit " + d.name });
    gEl.append(svg("rect", { x:p.x, y:p.y, width:W, height:H, rx:10, fill:"#fbf9f5", stroke:"rgba(35,34,31,.25)" }),
      d.img ? svg("image", { href:d.img, x:p.x + 6, y:p.y + 7, width:32, height:32, preserveAspectRatio:"xMidYMid slice", "clip-path":"url(#cp-" + d.id + ")" }) : svg("circle", { cx:p.x + 22, cy:p.y + H / 2, r:7, fill:colorOf(d) }),
      Object.assign(svg("text", { x:p.x + 44, y:p.y + 20, "font-size":14, fill:"#23221f" }), { textContent:d.name }),
      Object.assign(svg("text", { x:p.x + 44, y:p.y + 36, "font-size":11, fill:"#7c776d" }), { textContent:(r ? r.name : "no rider recorded") + (d.status === "deceased" ? " †" : "") }));
    gEl.addEventListener("click", () => editForm(d));
    gEl.addEventListener("keydown", e => { if (e.key === "Enter") editForm(d); });
    el.append(gEl);
  });
  return h("div", {}, h("div", { class:"legend" }, h("span", {}, h("b", { style:"color:#4a6fa8" }, "━"), " sire"), h("span", {}, h("b", { style:"color:#a8502d" }, "━"), " dam"), h("span", {}, "Click a dragon to edit")),
    h("div", { class:"axis-wrap", style:"padding:10px" }, el));
}

function table() {
  const cols = [["name","Name"],["color","Color"],["tail","Tail"],["sex","Sex"],["family","Line"],["age","Est. age"],["riders","Recorded riders"],["rider","Bonded rider"],["status","Status"]];
  const val = x => ({ rider:(E.byId("characters", x.riderId) || {}).name || "", tail:tailOf(x), status:x.status })[sortKey] ?? x[sortKey];
  const rows = data.dragons.filter(x => !x.gryphon).sort((a, b) => { const x = val(a), y = val(b); return (x == null || x === "" ? 1 : y == null || y === "" ? -1 : typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y))) * sortDir; });
  const cell = x => h("td", { style:"padding:.5rem .7rem;border-top:1px solid var(--line);white-space:nowrap" }, x);
  return h("div", { class:"axis-wrap" }, h("table", { style:"border-collapse:collapse;width:100%;font-size:14px" },
    h("thead", {}, h("tr", {}, cols.map(([k, l]) => h("th", { style:"text-align:left;padding:.6rem .7rem;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);cursor:pointer", onclick:() => { sortDir = sortKey === k ? -sortDir : 1; sortKey = k; render(); } }, l + (sortKey === k ? (sortDir > 0 ? " ↑" : " ↓") : ""))))),
    h("tbody", {}, rows.map(x => h("tr", { style:"cursor:pointer", onclick:() => editForm(x) },
      cell(h("span", {}, h("span", { class:"dot", style:"background:" + colorOf(x) }), x.name)), cell(x.color || "—"), cell(tailOf(x) ? tailOf(x) + " tail" : "—"), cell(x.sex || "—"), cell(x.family || "—"),
      cell(x.age != null && x.age !== "" ? x.age : "—"), cell(x.riders != null && x.riders !== "" ? x.riders : "—"), cell((E.byId("characters", x.riderId) || {}).name || "—"), cell(x.status === "unknown" ? "not set" : x.status))))));
}

function gryphons() {
  const list = data.dragons.filter(x => x.gryphon).sort((a, b) => a.name.localeCompare(b.name));
  return list.length ? h("div", { class:"grid" }, list.map(dragonCard)) : E.emptyState("No gryphons yet. Press “+ Add gryphon”.");
}

function render() {
  app.replaceChildren(
    h("div", { class:"toolbar" }, E.tabs([["families","Families"],["table","Details table"],["tree","Genealogy tree"],["gryphons","Gryphons"]], tab, k => { tab = k; render(); }), h("span", { class:"grow" }),
      h("button", { class:"btn primary", onclick:() => editForm(tab === "gryphons" ? { gryphon:true, status:"unknown" } : {}) }, tab === "gryphons" ? "+ Add gryphon" : "+ Add dragon")),
    tab === "families" ? h("div", {}, families()) : tab === "table" ? table() : tab === "gryphons" ? gryphons() : tree());
}
render();
</script></body></html>
