function attachPointers() {

const HINTS = { browse:"Drag to pan, scroll or pinch to zoom, tap a place for details.", move:"Move mode: drag a place to reposition it. Changes save as soon as you let go.",

/* ---------- details ---------- */

    h("div", { class:"row", style:"justify-content:space-between" }, h("h3", {}, l.name, E.unverified(l)), h("span", { class:"pill s-unknown", style:"color:" + (COLOR[l.kind] || "#777") }, KIND_LABEL[l.kind] || l.kind)),

/* ---------- list view ---------- */
