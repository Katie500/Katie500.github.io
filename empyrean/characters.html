<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Characters — Empyrean Notebook</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="empyrean.css">
</head><body><div class="wrap"><main id="app"></main></div>
<script src="seed.js"></script><script src="app.js"></script>
<script>
const { h, data } = E;
E.layout("characters.html", "Who’s <em>still standing</em>", "Track every character’s status, their dragon, and the rebel children separately.");
const app = document.getElementById("app");
const STATUS = [["active","Active"],["missing","Missing"],["deceased","Deceased"],["unknown","Not set"]];
const QUADRANTS = [["riders","Riders Quadrant"],["infantry","Infantry Quadrant"],["scribe","Scribe Quadrant"],["healer","Healer Quadrant"],["none","No quadrant"]];
const QLABEL = Object.fromEntries(QUADRANTS);
// dragon riders default to the Riders Quadrant and Jesinia to Scribes until you set one; anything you choose wins
const GROUP_QUAD = { rider:"riders", infantry:"infantry", scribe:"scribe", healer:"healer" };
const ROLE_LABEL = { rider:"Dragon rider", flier:"Gryphon rider", infantry:"Infantry cadet", scribe:"Scribe", healer:"Healer", professor:"Professor / officer", civilian:"Civilian / other", antagonist:"Antagonist" };
const quadOf = c => GROUP_QUAD[c.group] || c.quadrant || (/^Jesinia Neilwart$/.test(c.name) ? "scribe" : "");
let tab = "all", q = "", quad = "all";

const editForm = (c = {}) => E.form({
  title: c.id ? "Edit character" : "Add character", value:c,
  fields: [
    { k:"title", label:"Title", type:"select", options:[{ v:"", l:"— none —" }, ...[...E.TITLES, ...(c.title && !E.TITLES.includes(c.title) ? [c.title] : [])].map(t => ({ v:t, l:t }))] },
    { k:"name", label:"Name", type:"text", hint:"Without the title, e.g. Kaori rather than Professor Kaori." },
    { k:"aliases", label:"Alternate names", type:"text", hint:"Comma-separated: nicknames, titles, former names." },
    { k:"origin", label:"Home province / origin", type:"text", placeholder:"e.g. Krovla (Poromiel)" },
    { k:"group", label:"Role", hint:"Scribe, Infantry and Healer also set their Basgiath quadrant.", type:"select", options:[{v:"rider",l:"Dragon rider"},{v:"flier",l:"Gryphon rider (flier)"},{v:"infantry",l:"Infantry cadet"},{v:"scribe",l:"Scribe"},{v:"healer",l:"Healer"},{v:"professor",l:"Professor / officer"},{v:"civilian",l:"Civilian / other"},{v:"antagonist",l:"Antagonist"}] },
    { k:"status", label:"Status", type:"select", options:STATUS.map(([v, l]) => ({ v, l })) },
    { k:"rebelChild", label:"Rebel child (child of an executed rebel)", type:"checkbox" },
    { k:"venin", label:"Venin", type:"checkbox" },
    { k:"signetIds", label:"Signets", type:"multi", options:E.optionsOf("signets", s => s.name), hint:"Tick every signet they have (a double-signet rider gets two). Add new kinds on the Signets page." },
    { k:"gryphon", label:"Gryphon (name)", type:"text", hint:"For gryphon riders (fliers). Leave blank for dragon riders." },
    { k:"dragonId", label:"Bonded dragon", type:"select", options:E.optionsOf("dragons", d => d.name, "— none —", d => !d.gryphon) },
    { k:"fateEventId", label:"Event where their status changed", type:"select", options:E.optionsOf("events", e => E.bookOf(e.book).id + ": " + e.title, "— none —") },
    { k:"notes", label:"Notes", type:"textarea" },
    { k:"cites", label:"Page references", type:"cites" },
  ],
  onSave: o => { o.id = o.id || E.uid("c"); E.upsert("characters", o); render(); },
  onDelete: c.id ? () => { E.remove("characters", c.id); render(); } : null,
});

function card(c) {
  const d = E.byId("dragons", c.dragonId), ev = E.byId("events", c.fateEventId), sigs = (c.signetIds || []).map(id => E.byId("signets", id)).filter(Boolean);
  return h("div", { class:"card", id:c.id },
    h("div", { class:"row", style:"justify-content:space-between" }, h("h3", {}, E.fullName(c), E.unverified(c)), h("span", { class:"pill s-" + c.status }, c.status === "unknown" ? "not set" : c.status)),
    c.aliases ? h("div", { class:"meta" }, "also known as " + c.aliases) : null,
    h("div", { class:"meta" }, ROLE_LABEL[c.group] || c.group, quadOf(c) && quadOf(c) !== "riders" || c.group === "rider" ? " · " + QLABEL[quadOf(c)] : "", c.origin ? " · from " + c.origin : "", c.rebelChild ? " · rebel child" : "", d ? " · bonded to " + d.name : "", c.gryphon ? " · gryphon " + c.gryphon : "", c.venin ? h("span", { class:"pill s-deceased", style:"margin-left:.4rem" }, "venin") : null),
    sigs.length ? h("div", { class:"row", style:"margin:.35rem 0" }, h("span", { class:"meta" }, sigs.length > 1 ? "Signets:" : "Signet:"), sigs.map(s => h("a", { class:"chip", href:"signets.html#" + s.id }, s.name))) : null,
    ev ? h("div", { class:"meta" }, "Changed at: ", h("a", { href:"timeline.html#" + ev.id }, ev.title)) : null,
    c.notes ? h("p", { style:"margin:.5rem 0;font-size:14px" }, c.notes) : null,
    (c.cites || []).map(E.citeView),
    h("div", { class:"row", style:"margin-top:.7rem" },
      h("select", { "aria-label":"Status of " + c.name, style:"width:auto;padding:.25rem .5rem;font-size:13px", onchange:e => { c.status = e.target.value; E.upsert("characters", c); render(); } },
        STATUS.map(([v, l]) => h("option", { value:v, selected:c.status === v }, l))),
      h("button", { class:"btn sm", onclick:() => editForm(c) }, "Edit")));
}

const signetNames = x => (x.signetIds || []).map(id => (E.byId("signets", id) || {}).name || "").join(" ");
const matches = x => {
  const byTab = tab === "all" || (tab === "signet" ? (x.signetIds || []).length > 0 : tab === "nosignet" ? (x.group === "rider" || x.group === "flier") && !(x.signetIds || []).length : tab === "rebel" ? x.rebelChild : tab === "fliers" ? (x.group === "flier" || !!x.gryphon) : tab === "krovla" ? /krovla/i.test(x.origin || "") : tab === "venin" ? x.venin : tab === "riders" ? x.group === "rider" && !x.gryphon : x.status === tab);
  if (quad !== "all" && (quad === "unset" ? quadOf(x) : quadOf(x) !== quad)) return false;
  return !!byTab && (E.fullName(x) + " " + (x.aliases || "") + " " + (x.origin || "") + " " + (QLABEL[quadOf(x)] || "") + " " + signetNames(x)).toLowerCase().includes(q);
};
const EMPTY = {
  signet:"No one has a signet recorded yet. Edit a character and tick their signets.",
  nosignet:"Every rider has a signet recorded.",
  rebel:"No rebel children marked yet. Edit a character and tick “Rebel child”.",
  fliers:"No gryphon riders yet. Edit a character, set their role to Gryphon rider and add their gryphon.",
  krovla:"No one is marked as from Krovla yet. Edit a character and set their home province.",
  venin:"No one is marked as venin. Edit a character and tick “Venin”.",
  active:"No one is marked Active yet. Use the status menu on a card.",
  missing:"No one is marked Missing yet. Use the status menu on a card.",
  deceased:"No one is marked Deceased yet. Use the status menu on a card.",
  unknown:"Everyone has a status set.",
};

function render() {
  const counts = k => data.characters.filter(c => c.status === k).length;
  const pill = (k, cls, label) => h("button", { type:"button", class:"pill " + cls, "aria-pressed":String(tab === k), style:"background:none;cursor:pointer;font:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase" + (tab === k ? ";background:rgba(35,34,31,.08)" : ""), onclick:() => { tab = tab === k ? "all" : k; render(); } }, counts(k) + " " + label);
  app.replaceChildren(
    h("div", { class:"toolbar" },
      E.tabs([["all","All"],["riders","Dragon riders"],["fliers","Gryphon riders"],["signet","Has a signet"],["nosignet","Riders with no signet"],["rebel","Rebel children"],["krovla","Krovla"],["venin","Venin"],["active","Active"],["missing","Missing"],["deceased","Deceased"],["unknown","Not set"]], tab, k => { tab = k; render(); }),
      h("select", { "aria-label":"Quadrant", onchange:e => { quad = e.target.value; render(); } }, h("option", { value:"all" }, "All quadrants"), QUADRANTS.map(([v, l]) => h("option", { value:v, selected:quad === v }, l)), h("option", { value:"unset", selected:quad === "unset" }, "No quadrant set")),
      h("span", { class:"grow" }),
      h("input", { type:"search", placeholder:"Search…", value:q, "aria-label":"Search characters", oninput:e => { q = e.target.value.toLowerCase(); renderList(); } }),
      h("button", { class:"btn primary", onclick:() => editForm() }, "+ Add character")),
    h("div", { class:"row", style:"margin-bottom:1rem" }, pill("active", "s-active", "active"), pill("missing", "s-missing", "missing"), pill("deceased", "s-deceased", "deceased"), pill("unknown", "s-unknown", "not set")),
    h("div", { id:"count", class:"meta", role:"status", style:"margin:-.3rem 0 .8rem" }),
    h("div", { id:"list" }));
  renderList();
}
function renderList() {
  const l = data.characters.filter(matches).sort((a, b) => a.name.localeCompare(b.name));
  document.getElementById("count").textContent = "Showing " + l.length + " of " + data.characters.length + " characters";
  document.getElementById("list").replaceChildren(l.length ? h("div", { class:"grid" }, l.map(card)) : E.emptyState(q ? "Nothing matches that search." : EMPTY[tab] || "Nothing matches."));
}
render();
</script></body></html>
